<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c6cff"/>
      <stop offset="100%" stop-color="#4a9eff"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <rect x="60" y="60" width="280" height="280" rx="32" ry="32" fill="url(#g)" fill-opacity="0.06"/>
  <rect x="70" y="70" width="260" height="260" rx="24" ry="24" stroke="url(#g)" stroke-width="3" opacity="0.15"/>
  <!-- Outer frame -->
  <rect x="80" y="80" width="240" height="240" rx="20" ry="20" stroke="url(#g)" stroke-width="6" opacity="0.3"/>
  <rect x="90" y="90" width="220" height="220" rx="16" ry="16" stroke="url(#g)" stroke-width="4" opacity="0.5"/>
  <!-- Letter P -->
  <text x="200" y="224" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="140" font-weight="700" fill="url(#g)" letter-spacing="8">P</text>
  <!-- Small decorative dots -->
  <circle cx="100" cy="100" r="3" fill="url(#g)" opacity="0.4"/>
  <circle cx="300" cy="100" r="3" fill="url(#g)" opacity="0.4"/>
  <circle cx="100" cy="300" r="3" fill="url(#g)" opacity="0.4"/>
  <circle cx="300" cy="300" r="3" fill="url(#g)" opacity="0.4"/>
</svg>
